tabs:
  main:
    display: Principal
    sections:
      -
        fields:
          -
            handle: intro
            field:
              buttons:
                - anchor
                - underline
                - strikethrough
                - superscript
                - subscript
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
              remove_empty_nodes: trim
              type: bard
              display: Introduction
              validate:
                - required
  'nos missions':
    display: 'Nos missions'
    sections:
      -
        fields:
          -
            handle: missions_image_title
            field:
              container: titles
              type: assets
              display: 'Titre image'
              validate:
                - required
                - 'mimes:svg'
              restrict: true
              max_files: 1
              min_files: 1
  actions:
    display: 'Nos actions'
    sections:
      -
        fields:
          -
            handle: actions_image_title
            field:
              container: titles
              type: assets
              display: 'Titre image'
              validate:
                - required
                - 'mimes:svg'
              restrict: true
              max_files: 1
              min_files: 1
  news:
    display: 'Nos actualités'
    sections:
      -
        fields:
          -
            handle: news_image_title
            field:
              container: titles
              type: assets
              display: 'Titre image'
              validate:
                - required
                - 'mimes:svg'
              restrict: true
              max_files: 1
              min_files: 1
      -
        display: 'Bouton voir plus'
        fields:
          -
            handle: button_text
            field:
              type: text
              display: Texte
              validate:
                - required
          -
            handle: button_link
            field:
              type: link
              display: Lien
              validate:
                - required
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
      -
        display: SEO
        fields:
          - import: seo_base
  newsletter:
    display: 'Newsletter / Contact'
    sections:
      -
        display: Contact
        fields:
          -
            handle: contact_text
            field:
              type: textarea
              display: Texte
              validate:
                - required
      -
        display: Newsletter
        fields:
          -
            handle: newsletter_text
            field:
              type: textarea
              display: Texte
              validate:
                - required
          -
            handle: newsletter_button
            field:
              type: text
              display: Bouton
              validate:
                - required
          -
            handle: newsletter_email_placeholder
            field:
              type: text
              display: 'Placeholder email'
              validate:
                - required
          -
            handle: newsletter_success_message
            field:
              type: text
              display: 'Message de succès'
              validate:
                - required
          -
            handle: newsletter_rgpd_text
            field:
              type: textarea
              display: 'Texte RGPD'
              validate:
                - required
title: Home
