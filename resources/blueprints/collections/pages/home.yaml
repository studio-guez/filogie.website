tabs:
  main:
    display: Principal
    sections:
      -
        fields:
          -
            handle: image_title_h1
            field:
              container: assets
              type: assets
              display: 'Titre image'
              validate:
                - required
                - 'mimes:svg'
          -
            handle: intro
            field:
              buttons:
                - anchor
                - underline
                - strikethrough
                - superscript
                - subscript
                - bold
                - italic
                - unorderedlist
                - orderedlist
              remove_empty_nodes: trim
              type: bard
              display: Introduction
              validate:
                - required
  'nos missions':
    display: 'Nos missions'
    sections:
      -
        fields:
          -
            handle: missions_image_title
            field:
              container: assets
              type: assets
              display: 'Titre image'
              validate:
                - required
                - 'mimes:svg'
  actions:
    display: 'Nos actions'
    sections:
      -
        fields:
          -
            handle: actions_image_title
            field:
              container: assets
              type: assets
              display: 'Titre image'
              validate:
                - required
                - 'mimes:svg'
  news:
    display: 'Nos actualités'
    sections:
      -
        fields:
          -
            handle: news_image_title
            field:
              container: assets
              type: assets
              display: 'Titre image'
              validate:
                - required
                - 'mimes:svg'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
title: Home
