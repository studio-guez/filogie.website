tabs:
  main:
    display: Principal
    sections:
      -
        fields:
          -
            handle: title_h1
            field:
              type: text
              display: 'Titre affiché'
              validate:
                - required
          -
            handle: intro
            field:
              buttons:
                - anchor
                - underline
                - strikethrough
                - superscript
                - subscript
                - bold
                - italic
                - unorderedlist
                - orderedlist
              remove_empty_nodes: trim
              type: bard
              display: Introduction
              validate:
                - required
          -
            handle: image_title_h1
            field:
              container: assets
              type: assets
              display: 'Image titre'
              validate:
                - required
                - 'mimes:svg'
  'nos missions':
    display: 'Nos missions'
    sections:
      -
        fields:
          -
            handle: missions_title
            field:
              type: text
              display: Titre
              validate:
                - required
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
title: Home
